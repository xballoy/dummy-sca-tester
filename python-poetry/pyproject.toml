[project]
name = "sca-fixture-poetry"
version = "1.0.0"
description = "Poetry-managed variant exercising poetry.lock parsing"
requires-python = ">=3.9,<3.14"
dependencies = [
    "Django==3.2.4",
    "PyYAML==5.3.1",
    "Jinja2==2.11.2",
    "urllib3==1.26.4",
    "requests==2.25.1",
    "Unidecode==1.4.0",
    "text-unidecode==1.3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
Flask = "0.12.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
